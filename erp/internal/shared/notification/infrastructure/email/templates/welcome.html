<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .header { background: #1a56db; color: #fff; padding: 32px 40px; }
    .header h1 { margin: 0; font-size: 24px; }
    .body { padding: 32px 40px; color: #333; line-height: 1.6; }
    .footer { background: #f0f0f0; padding: 16px 40px; font-size: 12px; color: #888; text-align: center; }
    .btn { display: inline-block; background: #1a56db; color: #fff; padding: 12px 24px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Bienvenido a {{.CompanyName}}</h1>
    </div>
    <div class="body">
      <p>Hola <strong>{{.Name}}</strong>,</p>
      <p>Tu cuenta ha sido creada exitosamente. Ya puedes acceder al sistema con tu correo electrónico.</p>
      {{if .LoginURL}}
      <a href="{{.LoginURL}}" class="btn">Ingresar al sistema</a>
      {{end}}
    </div>
    <div class="footer">Este correo fue generado automáticamente. Por favor no respondas a este mensaje.</div>
  </div>
</body>
</html>
