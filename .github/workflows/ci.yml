name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # No son secretos reales -- solo necesitan tener el formato que main.go valida al arrancar
      # (ver erp/.env.example). SUPERADMIN_EMAIL/PASSWORD y SMTP_HOST quedan vacías a propósito
      # (sin superadmin sembrado, servidor de correo en modo noop) para no depender de nada externo.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_ci?sslmode=disable
      JWT_SECRET: ci-only-secret-not-for-production-use
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: go vet (erp)
        working-directory: erp
        run: go vet ./...

      - name: go vet (cofacture)
        working-directory: cofacture
        run: go vet ./...

      - name: go build (erp, incl. tag integration)
        working-directory: erp
        run: |
          go build ./...
          go build -tags=integration ./...

      - name: go build (cofacture)
        working-directory: cofacture
        run: go build ./...

      # golang-migrate corre las migraciones de los 14 módulos al arrancar main() (secuencial,
      # antes de escuchar el puerto) -- levantar el server real contra el Postgres de servicio es
      # la forma más directa de dejar el schema listo para los schema_test.go de -tags=integration,
      # sin duplicar esa lógica de arranque en el workflow.
      - name: aplicar migraciones (levantar server contra Postgres de CI)
        working-directory: erp
        run: |
          go build -o server_ci ./cmd/server
          ./server_ci > server_ci.log 2>&1 &
          echo $! > server_ci.pid
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health >/dev/null 2>&1; then READY=1; break; fi
            if ! kill -0 "$(cat server_ci.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$(cat server_ci.pid)" 2>/dev/null || true
          rm -f server_ci server_ci.pid
          echo "── log del server ──"
          cat server_ci.log
          if [ "$READY" != "1" ]; then
            echo "El server no llegó a responder /health -- migraciones fallidas, ver log arriba."
            exit 1
          fi

      - name: go test (erp, -tags=integration)
        working-directory: erp
        run: go test ./... -tags=integration -v

      - name: go test (cofacture)
        working-directory: cofacture
        run: go test ./...

      - name: govulncheck (erp)
        working-directory: erp
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: govulncheck (cofacture)
        working-directory: cofacture
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: lint (oxlint)
        run: npm run lint

      - name: build (tsc -b + vite build)
        run: npm run build

      # Bloqueante desde el punto 20 (2026-08-10): react-router/postcss/nanoid ya actualizados,
      # npm audit está en 0 vulnerabilidades. Antes era continue-on-error mientras esas
      # vulnerabilidades conocidas seguían sin corregir.
      - name: npm audit
        run: npm audit --audit-level=high
